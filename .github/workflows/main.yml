name: Build Genie Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android repository
        uses: actions/checkout@v4

      - name: Checkout original Genie website
        uses: actions/checkout@v4
        with:
          repository: bosta58/-loneberakning
          path: source

      - name: Prepare Genie web files
        run: |
          mkdir -p www
          cp -R source/. www/
          rm -rf www/.git

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Genie with Android
        run: npx cap sync android

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease
